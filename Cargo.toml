[package]
name = "oaph"
version = "0.3.0"
authors = ["oaph contributors"]
description = "Helps to subtituate query params and schema definitions to openapi3/asyncapi yaml"
readme = "README.md"
keywords = ["asyncapi", "openapi3"]
repository = "https://github.com/estin/oaph.git"
documentation = "https://docs.rs/oaph/"
categories = ["development-tools", "template-engine"]
license = "MIT"
edition = "2021"
resolver = "2"

[dependencies]
schemars = { version = "1", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde-saphyr = { version = "2", default-features = false, features = ["serialize"] }
