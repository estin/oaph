openapi: 3.0.0
info:
  title: Example
  version: 1.0.0
paths:
  /insert:
    post:
      description: some description
      parameters:
        title: Request
        type: object
        properties:
          username:
            type: string
        required:
        - username
      responses:
        '201':
          description: successfully created
          content:
            application/json:
              title: Response
              type: object
              properties:
                success:
                  type: boolean
                count:
                  type: integer
                  format: uint
                  minimum: 0
                items:
                  type: array
                  items:
                    $ref: "#/definitions/Item"
              required:
              - success
              - count
              - items
definitions:
  Item:
    type: object
    properties:
      id:
        type: integer
        format: uint
        minimum: 0
      width:
        type: number
        format: double
        nullable: true
      owner:
        $ref: "#/definitions/User"
    required:
    - id
    - owner
  User:
    type: object
    properties:
      id:
        type: integer
        format: uint
        minimum: 0
      username:
        type: string
      tags:
        type: array
        items:
          type: string
    required:
    - id
    - username
    - tags
